name: "Configure AWS Credentials"

on:
  push:
    branches:
      - main
      - release
  pull_request:
    branches:
      - main
      - release

permissions:
  id-token: write # Required for requesting the JWT/OIDC token
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: PROD

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Get AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          audience: 'sts.amazonaws.com'
          aws-region: 'ap-southeast-1'
          role-to-assume: "${{ secrets.AWS_ROLE_TO_ASSUME }}"
          role-session-name: "hawkerflow-ecr-role"
          
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push docker image to AWS ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t ${{ env.REGISTRY }}/hawkerflow/service-hawker .
          docker tag ${{ env.REGISTRY }}/hawkerflow/service-hawker ${{ env.REGISTRY }}/hawkerflow/service-hawker:${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/hawkerflow/servie-hawker:${{ env.IMAGE_TAG }}

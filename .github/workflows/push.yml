name: "Configure AWS Credentials"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - release

permissions:
  id-token: write # Required for requesting the JWT/OIDC token
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      - name: "Generate Application Resources"
        env:
          DB_HOST_VAR: ${{ vars.DB_HOST }}
        run: |
          mvn clean package \
            -Ddb.host=${{ env.DB_HOST_VAR }} \
            -Ddb.user=${{ secrets.POSTGRES_USER }} \
            -Ddb.password=${{ secrets.POSTGRES_SECRET }}
          
          echo ${{ env.DB_HOST_VAR }}

      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Get AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          audience: 'sts.amazonaws.com'
          aws-region: 'ap-southeast-1'
          role-to-assume: "${{ secrets.AWS_ROLE_TO_ASSUME }}"
          role-session-name: "hawkerflow-ecr-role"
          
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push docker image to AWS ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t hawkerflow/service-hawker .
          docker tag hawkerflow/service-hawker:latest ${{ env.REGISTRY }}/hawkerflow/service-hawker:latest
          docker push ${{ env.REGISTRY }}/hawkerflow/service-hawker:latest
